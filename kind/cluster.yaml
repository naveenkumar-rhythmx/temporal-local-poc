# kind cluster config for temporal-local-poc
# Maps host ports for local access without extra ingress controllers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: temporal-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
      - containerPort: 30082
        hostPort: 30082
        protocol: TCP
  - role: worker
  - role: worker
