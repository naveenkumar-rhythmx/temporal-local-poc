apiVersion: v1
kind: Service
metadata:
  name: patient-data-services
  namespace: patient-data-services
  labels:
    app: patient-data-services
spec:
  type: NodePort
  selector:
    app: patient-data-services
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-data-services
  namespace: patient-data-services
  labels:
    app: patient-data-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-data-services
  template:
    metadata:
      labels:
        app: patient-data-services
    spec:
      containers:
        - name: patient-data-services
          image: temporal-local/patient-data-services:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: patient-data-services-config
          readinessProbe:
            httpGet:
              path: /patient-services/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /patient-services/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patient-data-services-config
  namespace: patient-data-services
data:
  APP_ENV: local
  LOG_LEVEL: INFO
  ROOT_PATH_PREFIX: /patient-services
  WORKFLOW_STARTER_URL: http://orchestration-core-services.temporal-workflows.svc.cluster.local:8000
