apiVersion: v1
kind: Service
metadata:
  name: orchestration-core-services
  namespace: temporal-workflows
  labels:
    app: orchestration-core-services
spec:
  type: NodePort
  selector:
    app: orchestration-core-services
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-core-services
  namespace: temporal-workflows
  labels:
    app: orchestration-core-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestration-core-services
  template:
    metadata:
      labels:
        app: orchestration-core-services
    spec:
      containers:
        - name: api
          image: temporal-local/workflow-starter:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: orchestration-core-services-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestration-core-services-config
  namespace: temporal-workflows
data:
  TEMPORAL_HOST: temporal-frontend.temporal.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: default
