apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: patient-data-services
type: Opaque
stringData:
  POSTGRES_USER: patient_app
  POSTGRES_PASSWORD: local-only-change-me
  POSTGRES_DB: patient_db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-postgres
  namespace: patient-data-services
  labels:
    app: app-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-postgres
  template:
    metadata:
      labels:
        app: app-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "patient_app", "-d", "patient_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "patient_app", "-d", "patient_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-postgres-pvc
        - name: init
          configMap:
            name: app-postgres-init
